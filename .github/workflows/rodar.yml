name: LegisTech — Coleta e Matching diário

on:
  schedule:
  - cron: '0 11 * * 1-5'
  workflow_dispatch:

jobs:
  coletar-e-processar:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Rodar coletor PNCP
        run: python scripts/coletor.py --ufs PI MA --dias 30

      - name: Rodar motor de matching
        run: python scripts/motor_matching.py

      - name: Rodar motor de IA
        run: python scripts/motor_ia.py
        # Falha de cota ou timeout do Gemini não deve cancelar o envio de alertas
        continue-on-error: true

      - name: Enviar alertas Telegram
        run: python scripts/alertas_telegram.py
