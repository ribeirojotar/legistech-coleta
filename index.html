<script>
// ─────────────────────────────────────────────────────────────
// CONFIG SUPABASE
// ─────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://ojrowbvwnraqdikrvnlv.supabase.co';
const SUPABASE_KEY = 'SUA_KEY';

// ─────────────────────────────────────────────────────────────
// HELPERS SUPABASE
// ─────────────────────────────────────────────────────────────
async function supabase(table, query = '') {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}${query}`, {
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json'
      }
    });

    if (!r.ok) throw new Error(await r.text());

    return await r.json();
  } catch (e) {
    console.error('SUPABASE GET ERROR:', e);
    return [];
  }
}

async function supabasePost(table, data) {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}`, {
      method: 'POST',
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        Prefer: 'return=minimal'
      },
      body: JSON.stringify(data)
    });

    if (!r.ok) {
      console.error(await r.text());
      return false;
    }

    return true;
  } catch (e) {
    console.error('SUPABASE POST ERROR:', e);
    return false;
  }
}

async function supabasePatch(table, id, data) {
  try {
    const r = await fetch(`${SUPABASE_URL}/rest/v1/${table}?id=eq.${id}`, {
      method: 'PATCH',
      headers: {
        apikey: SUPABASE_KEY,
        Authorization: `Bearer ${SUPABASE_KEY}`,
        'Content-Type': 'application/json',
        Prefer: 'return=minimal'
      },
      body: JSON.stringify(data)
    });

    if (!r.ok) {
      console.error(await r.text());
      return false;
    }

    return true;
  } catch (e) {
    console.error('SUPABASE PATCH ERROR:', e);
    return false;
  }
}
